[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-college-planner"
version = "1.0.0"
description = "AI-powered college planning system for high school students"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI College Planning Team"}
]
keywords = ["college", "planning", "education", "ai", "admissions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.9",
    "openai>=1.0",
    "anthropic>=0.18",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.25",
    "python-dateutil>=2.8",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
college-planner = "src.main:app"
test-ui = "src.test_ui.cli:main"
test-web = "src.test_ui.web:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
